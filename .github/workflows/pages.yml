name: Publish Soffiolieve HD-2D
on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Download verified demo release
        run: curl --fail --location --retry 3 https://github.com/kazael96/soffiolieve-hd2d/releases/download/v0.8/soffiolieve-demo-v08.zip -o site.zip
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Build verified site from editable sources
        run: python3 scripts/build-site.py site.zip _site
      - name: Check source syntax
        run: for file in src/*.js; do node --check "$file"; done
      - name: Run all automated regressions on the built site
        run: node scripts/test-deep.cjs _site test-results/deep --python=python3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-regression-report
          path: test-results/deep
          if-no-files-found: ignore
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
