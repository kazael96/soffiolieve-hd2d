name: Publish Soffiolieve HD-2D
on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download verified demo release
        run: curl --fail --location --retry 3 https://github.com/kazael96/soffiolieve-hd2d/releases/download/v0.8/soffiolieve-demo-v08.zip -o site.zip
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Build verified site from editable sources
        run: python3 scripts/build-site.py site.zip _site
      - name: Check source syntax
        run: for file in src/*.js; do node --check "$file"; done
      - name: Run all automated regressions on the built site
        run: node scripts/test-deep.cjs _site test-results/deep --python=python3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-regression-report
          path: test-results/deep
          if-no-files-found: ignore
      - name: Install pinned introduction browser driver
        run: npm install --no-save --ignore-scripts --package-lock=false playwright@1.62.1
      - name: Install browser system dependencies
        run: npx --no-install playwright install-deps chromium
      - name: Verify sandboxed system Chrome
        run: |
          test -x /opt/google/chrome/chrome
          /opt/google/chrome/chrome --version
      - name: Check production introduction in all three formats
        run: node scripts/test-introduction-headless.cjs _site test-results/introduction --browser=/opt/google/chrome/chrome --renderer=software
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-introduction-browser-report
          path: test-results/introduction
          if-no-files-found: ignore
      - name: Check title and save selection in all three formats
        run: node scripts/test-start-menu-headless.cjs _site test-results/start-menu --browser=/opt/google/chrome/chrome --renderer=software
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-start-menu-browser-report
          path: test-results/start-menu
          if-no-files-found: ignore
      - name: Check Aralia ball release at all speeds in all three formats
        run: node scripts/test-intro-release-headless.cjs _site test-results/intro-release --browser=/opt/google/chrome/chrome --renderer=software
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-intro-release-browser-report
          path: test-results/intro-release
          if-no-files-found: ignore
      - name: Check reported phone regressions in all three formats
        run: node scripts/test-browser-headless.cjs _site test-results/phone057 --browser=/opt/google/chrome/chrome --renderer=software --fail-fast=true --timeout=240000 --cases=qaFieldCamera057,qaFieldGate057,qaPhoneIdentity057,qaBattleClearings057,qaBattleDoubles057
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-phone057-browser-report
          path: test-results/phone057
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
