name: Publish Soffiolieve HD-2D
on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Download verified demo release
        run: curl --fail --location --retry 3 https://github.com/kazael96/soffiolieve-hd2d/releases/download/v0.8/soffiolieve-demo-v08.zip -o site.zip
      - name: Test controls, journey and build
        run: |
          node --test tests/*.test.cjs
          python3 -m unittest discover -s tests -p 'test_*.py'
          for file in src/*.js; do node --check "$file"; done
      - name: Build verified site from editable sources
        run: python3 scripts/build-site.py site.zip _site
      - name: Check published files and original opening
        run: |
          node tests/check-built-site.cjs _site
          node tests/check-render-assets.cjs _site
          node tests/check-story-runtime.cjs _site
          node tests/check-accumula-runtime.cjs _site
          node tests/check-route2-runtime.cjs _site
          node tests/check-field-stress.cjs _site
          node tests/check-mobile-runtime.cjs _site
          node tests/check-opponent-runtime.cjs _site
          node tests/check-checkpoint-stress.cjs _site
          node tests/check-combat-stress.cjs _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
