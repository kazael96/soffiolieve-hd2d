name: Deep regression checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Download verified base assets
        run: curl --fail --location --retry 3 https://github.com/kazael96/soffiolieve-hd2d/releases/download/v0.8/soffiolieve-demo-v08.zip -o site.zip
      - name: Build exact sources
        run: python3 scripts/build-site.py site.zip _site
      - name: Run all automated regressions
        run: node scripts/test-deep.cjs _site test-results/deep --python=python3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deep-regression-report
          path: test-results/deep
          if-no-files-found: ignore
